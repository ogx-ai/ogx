name: Setup Ollama
description: Start Ollama and pull required models
inputs:
  suite:
    description: 'Test suite to use: base, responses, vision, etc.'
    required: false
    default: ''
  setup:
    description: 'Setup name (ollama, ollama-vision, ollama-reasoning, etc.)'
    required: false
    default: 'ollama'
  ollama-version:
    description: 'Ollama server release to run (Docker Hub tag, without the leading v). Tracked weekly by check-provider-versions.yml.'
    required: false
    default: '0.34.2'
runs:
  using: "composite"
  steps:
    - name: Start Ollama
      shell: bash
      env:
        OLLAMA_VERSION: ${{ inputs.ollama-version }}
      run: |
        echo "Starting Ollama server $OLLAMA_VERSION..."
        docker run -d --name ollama -p 11434:11434 "ollama/ollama:${OLLAMA_VERSION}"
        echo "Verifying Ollama status..."
        timeout 30 bash -c 'while ! curl -s -L http://127.0.0.1:11434; do sleep 1 && echo "."; done'
        echo "Ollama is ready"

    - name: Pull models
      shell: bash
      env:
        SETUP: ${{ inputs.setup }}
        SUITE: ${{ inputs.suite }}
      run: |
        pull_model() {
          echo "Pulling $1..."
          docker exec ollama ollama pull "$1"
        }

        if [ "$SUITE" == "vision" ]; then
          pull_model "llama3.2-vision:11b"
          pull_model "nomic-embed-text:v1.5"
        elif [ "$SETUP" == "ollama-reasoning" ]; then
          pull_model "deepseek-r1:1.5b"
          pull_model "nomic-embed-text:v1.5"
        else
          pull_model "llama3.2:3b-instruct-fp16"
          pull_model "nomic-embed-text:v1.5"
          pull_model "llama-guard3:1b"
        fi

        echo "All models pulled successfully"
