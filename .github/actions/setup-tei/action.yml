name: Setup Text Embeddings Inference
description: Start Text-Embeddings-Inference and load the embedding model
runs:
  using: "composite"
  steps:
    - name: Start Text-Embeddings-Inference
      shell: bash
      run: |
        echo "Starting Text-Embeddings-Inference server..."
        # cpu-1.9 is the CPU build; the un-suffixed tags are CUDA builds that
        # require nvidia-smi and fail on CPU-only runners.
        docker run -d --name tei -p 8080:80 \
          -e MODEL_ID=nomic-ai/nomic-embed-text-v1.5 \
          ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
        echo "Verifying Text-Embeddings-Inference status..."
        # The model is downloaded and loaded during first boot, so allow time
        timeout 300 bash -c 'while ! curl -s -L http://127.0.0.1:8080/health; do sleep 2 && echo "."; done'
        echo "Text-Embeddings-Inference is ready"
        # TEI has no /v1/models endpoint; /info reports the loaded model and
        # is only served once the model has finished loading.
        echo "Verifying the model is served..."
        curl -sf http://127.0.0.1:8080/info
