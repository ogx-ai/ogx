name: Setup vLLM
description: Install a pinned vLLM CPU wheel and model weights natively on the runner and start the server (no container)
inputs:
  port:
    description: 'Port for the vLLM server'
    required: false
    default: '8000'
  workdir:
    description: 'Directory for the vLLM virtualenv, wheel, model weights and server log'
    required: false
    default: '${{ runner.temp }}/vllm'
  suite:
    description: 'Test suite to serve: systemone runs the Tev1 decision model instead of Qwen3-0.6B'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Install vLLM 0.32.0 (CPU x86_64) and download model weights
      shell: bash
      run: |
        set -euo pipefail
        WORKDIR="${{ inputs.workdir }}"
        SUITE="${{ inputs.suite }}"
        mkdir -p "$WORKDIR"

        # Fail loudly if an artifact on disk doesn't match its pinned sha256. TLS
        # protects the download in transit; pinning the content also catches a
        # swapped or re-uploaded asset.
        verify() {
          echo "$2  $1" | sha256sum -c - \
            || { echo "Failed to verify sha256 for $1 (expected $2)" >&2; exit 1; }
        }

        # 1. vLLM CPU wheel, pinned to the official 0.32.0 GitHub release asset.
        #    Verify the hash BEFORE installing so we never install unauthenticated bytes.
        #    Transitive dependencies are resolved by uv; only vLLM itself is hash-pinned.
        WHEEL_NAME="vllm-0.32.0+cpu-cp38-abi3-manylinux_2_39_x86_64.whl"
        WHEEL="$WORKDIR/$WHEEL_NAME"
        WHEEL_SHA=e87a047cc5ab47eb14565dfcd060393876b33e913479982a56fca6fca73ed97a
        [ -f "$WHEEL" ] || curl -fsSL --retry 3 -o "$WHEEL" \
          "https://github.com/vllm-project/vllm/releases/download/v0.32.0/$WHEEL_NAME"
        verify "$WHEEL" "$WHEEL_SHA"

        # Isolated venv: vLLM pins its own torch, which must not leak into the project env.
        [ -d "$WORKDIR/venv" ] || uv venv --python 3.12 "$WORKDIR/venv"
        uv pip install --python "$WORKDIR/venv/bin/python" --torch-backend cpu "$WHEEL"
        "$WORKDIR/venv/bin/vllm" --version

        if [ "$SUITE" = "systemone" ]; then
          # 2. togethercomputer/Tev1-0.8B-experimental, pinned to an immutable HuggingFace
          #    commit. A Qwen3.5 (Qwen3_5ForConditionalGeneration) fine-tune, one of the
          #    architectures vLLM's structured decisions API (/v1/systemone) recognizes out
          #    of the box via its NextTokenStrategy -- no extra serve flags needed, since
          #    vLLM's logprobs_mode already defaults to raw_logprobs (the mode that
          #    strategy requires). Download if missing, but always re-verify the on-disk
          #    file (catches a corrupt cached copy).
          REV=6bb2dff14b38fea90ddb14d870166ccaf77374e9
          MODEL_DIR="$WORKDIR/models/Tev1-0.8B-experimental"
          mkdir -p "$MODEL_DIR"
          get_file() {
            dest="$MODEL_DIR/$1"
            [ -f "$dest" ] || curl -fsSL --retry 3 --max-time 900 -o "$dest" \
              "https://huggingface.co/togethercomputer/Tev1-0.8B-experimental/resolve/$REV/$1"
            verify "$dest" "$2"
          }
          get_file config.json b90b86f35c8e6925ef74ee04d0e758f0a845c83a42089ad82bbaa948de9b4204
          get_file tokenizer_config.json 4ed764fafae09ed7390f85ab1ddc28baa34a4805b4119048ba8d922abaaebcaf
          get_file vocab.json ce99b4cb2983d118806ce0a8b777a35b093e2000a503ebde25853284c9dfa003
          get_file merges.txt a9d356d7bdf1ef4949e3e748e95b8e10ad9d4e2e838eddc38a0a7b6b94d1db8d
          get_file model.safetensors.index.json d8a08838a613b025eb7952ed9db11696213e57e76a375661ef5c12f9dd5dcf4e
          get_file chat_template.jinja d78de6bee4c952ca3145eb161921560a6ede7b59a34e7e4be815f3c5386b4364
          get_file model.safetensors-00001-of-00001.safetensors 197de1eb141b93984a15e2def8a840726c5dd1349ea4e1b73b8e53abb9257408
          get_file tokenizer.json 5f9e4d4901a92b997e463c1f46055088b6cca5ca61a6522d1b9f64c4bb81cb42
          # Tev1 is a Qwen3.5-VL (multimodal) checkpoint; vLLM builds its
          # Qwen3VLProcessor from these at engine init and crashes without them.
          get_file preprocessor_config.json 27225450ac9c6529872ee1924fcb0962ff5634834f817040f444118116f4e516
          get_file video_preprocessor_config.json 7768af27c1fafa9cc9011c1dc20067e03f8915e03b63504550e11d5066986d13
        else
          # 2. Qwen/Qwen3-0.6B, pinned to an immutable HuggingFace commit. Download if
          #    missing, but always re-verify the on-disk file (catches a corrupt cached copy).
          REV=c1899de289a04d12100db370d81485cdf75e47ca
          MODEL_DIR="$WORKDIR/models/Qwen3-0.6B"
          mkdir -p "$MODEL_DIR"
          get_file() {
            dest="$MODEL_DIR/$1"
            [ -f "$dest" ] || curl -fsSL --retry 3 --max-time 900 -o "$dest" \
              "https://huggingface.co/Qwen/Qwen3-0.6B/resolve/$REV/$1"
            verify "$dest" "$2"
          }
          get_file config.json 660db3b73d788119c04535e48cf9be5f55bc3100841a718637ae695b442f27dd
          get_file generation_config.json 2325da0f15bb848e018c5ae071b7943332e9f871d6b60e2ed22ca97d4cb993d2
          get_file merges.txt 8831e4f1a044471340f7c0a83d7bd71306a5b867e95fd870f74d0c5308a904d5
          get_file model.safetensors f47f71177f32bcd101b7573ec9171e6a57f4f4d31148d38e382306f42996874b
          get_file tokenizer.json aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4
          get_file tokenizer_config.json d5d09f07b48c3086c508b30d1c9114bd1189145b74e982a265350c923acd8101
          get_file vocab.json ca10d7e9fb3ed18575dd1e277a2579c16d108e32f27439684afa0e10b1440910
        fi

    - name: Start vLLM decision server
      if: ${{ inputs.suite == 'systemone' }}
      shell: bash
      run: |
        set -euo pipefail
        WORKDIR="${{ inputs.workdir }}"
        PORT="${{ inputs.port }}"

        # setsid + nohup fully detach the server from this step's process group so it
        # keeps running after the step's shell exits (unlike a plain `&`). No chat/tool/
        # reasoning flags: those are the chat-serving path's own concerns and don't apply
        # to a decision checkpoint served for /v1/systemone.
        #
        # --enforce-eager: Tev1's hybrid GDN/Mamba (linear-attention) layers stall
        # torch.compile's inductor warmup on the runner's single bound core, so engine
        # init never finishes (no shm broadcast block, health never comes up). The eager
        # path skips compilation and starts in seconds; the perf cost is irrelevant for a
        # 0.8B decision model.
        #
        # --mm-processor-kwargs '{"max_pixels": 200704}': Tev1 is a VL architecture, so
        # vLLM profiles the multimodal encoder cache with a max-size dummy image. At the
        # processor default (longest_edge 16777216 px = 4096x4096 = 65k raw patches) the
        # vision tower's O(n^2) global attention takes far longer than the 15-minute
        # startup budget on the runner's single bound core. Cap vision input at 448x448
        # (196 tokens); the /v1/systemone judgment path is text-only, so the vision path
        # is never exercised.
        #
        # VLLM_CPU_OMP_THREADS_BIND: auto-setup gives the single worker one core, and a
        # GDN judgment call on one core is far too slow for a client read timeout. Bind
        # all 4 runner cores to the worker so decode runs ~4x faster.
        VLLM_CPU_OMP_THREADS_BIND='0-3' \
        HF_HUB_OFFLINE=1 setsid nohup "$WORKDIR/venv/bin/vllm" serve "$WORKDIR/models/Tev1-0.8B-experimental" \
          --host 127.0.0.1 \
          --port "$PORT" \
          --served-model-name togethercomputer/Tev1-0.8B-experimental \
          --max-model-len 8192 \
          --gpu-memory-utilization 0.5 \
          --enforce-eager \
          --mm-processor-kwargs '{"max_pixels": 200704}' \
          < /dev/null > "$WORKDIR/vllm.log" 2>&1 &
        VLLM_PID=$!
        echo "vLLM launched (detached, pid $VLLM_PID)"

        dump_log() {
          echo "::group::vLLM server log"
          cat "$WORKDIR/vllm.log" >&2
          echo "::endgroup::"
        }

        echo "Waiting for vLLM to be ready..."
        ready=false
        for _ in $(seq 1 180); do
          if curl -fsS "http://localhost:$PORT/health" >/dev/null 2>&1; then
            ready=true
            break
          fi
          if ! kill -0 "$VLLM_PID" 2>/dev/null; then
            echo "Failed to start vLLM: process exited." >&2
            dump_log
            exit 1
          fi
          sleep 5
        done
        if [ "$ready" != "true" ]; then
          echo "Failed to start vLLM within 15 minutes." >&2
          dump_log
          exit 1
        fi

        curl -fsS "http://localhost:$PORT/v1/models" | grep -q "togethercomputer/Tev1-0.8B-experimental"
        echo "vLLM decision server ready on :$PORT"

    - name: Start vLLM server
      if: ${{ inputs.suite != 'systemone' }}
      shell: bash
      run: |
        set -euo pipefail
        WORKDIR="${{ inputs.workdir }}"
        PORT="${{ inputs.port }}"

        # On the CPU backend --gpu-memory-utilization is the fraction of host RAM vLLM
        # reserves. The 0.92 default exceeds what a 16GB runner has free at startup.
        #
        # setsid + nohup fully detach the server from this step's process group so it
        # keeps running after the step's shell exits (unlike a plain `&`). The weights
        # are served from the hash-verified local directory, so HF is never contacted.
        #
        # KNOWN BUG: while --reasoning-parser is set, vLLM silently ignores structured
        # outputs on /v1/completions (vllm-project/vllm#57726).
        # test_openai_completion_guided_choice skips on vllm because of this; drop the
        # flag (and the skip) once the fix is in the pinned release.
        #
        HF_HUB_OFFLINE=1 setsid nohup "$WORKDIR/venv/bin/vllm" serve "$WORKDIR/models/Qwen3-0.6B" \
          --host 127.0.0.1 \
          --port "$PORT" \
          --served-model-name Qwen/Qwen3-0.6B \
          --enable-auto-tool-choice \
          --tool-call-parser hermes \
          --reasoning-parser deepseek_r1 \
          --max-model-len 8192 \
          --gpu-memory-utilization 0.5 \
          < /dev/null > "$WORKDIR/vllm.log" 2>&1 &
        VLLM_PID=$!
        echo "vLLM launched (detached, pid $VLLM_PID)"

        # The root cause of a startup failure (e.g. a worker crash) sits well above the
        # final stack trace, so dump the whole log rather than just its tail.
        dump_log() {
          echo "::group::vLLM server log"
          cat "$WORKDIR/vllm.log" >&2
          echo "::endgroup::"
        }

        echo "Waiting for vLLM to be ready..."
        ready=false
        for _ in $(seq 1 180); do
          if curl -fsS "http://localhost:$PORT/health" >/dev/null 2>&1; then
            ready=true
            break
          fi
          if ! kill -0 "$VLLM_PID" 2>/dev/null; then
            echo "Failed to start vLLM: process exited." >&2
            dump_log
            exit 1
          fi
          sleep 5
        done
        if [ "$ready" != "true" ]; then
          echo "Failed to start vLLM within 15 minutes." >&2
          dump_log
          exit 1
        fi

        curl -fsS "http://localhost:$PORT/v1/models" | grep -q "Qwen/Qwen3-0.6B"
        echo "vLLM ready on :$PORT"
