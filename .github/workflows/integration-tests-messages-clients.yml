name: Messages API - Claude Code Client Smoke Tests

run-name: Drive the latest Claude Code CLI and Agent SDK against /v1/messages (mock provider backend)

# Deliberately not a required status check, and should stay out of branch protection: it tracks
# upstream client releases we don't control, not our own code, so it must never gate a merge. See
# the non-blocking note below.
on:
  pull_request:
    branches:
      - main
      - 'release-[0-9]+.[0-9]+.x'
    types: [opened, synchronize, reopened]
    paths:
      - 'src/ogx/providers/inline/messages/**'
      - 'src/ogx_api/**'
      - 'tests/integration/messages/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/integration-tests-messages-clients.yml'
      - '.github/actions/setup-test-environment/action.yml'
      - '.github/actions/run-and-record-tests/action.yml'
      - 'scripts/integration-tests.sh'
      - 'scripts/mock_backend.py'
      - 'tests/integration/suites.py'
  merge_group:
    branches:
      - main
      - 'release-[0-9]+.[0-9]+.x'
  workflow_dispatch:
    inputs:
      claude-code-version:
        description: 'Exact Claude Code CLI version, such as 2.1.274, overriding latest. Use it to bisect a failure.'
        type: string
        default: ''
      agent-sdk-version:
        description: 'Exact claude-agent-sdk version, such as 0.2.157, overriding latest. Use it to bisect a failure.'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-code-client-smoke:
    name: Claude Code CLI + Agent SDK smoke (mock provider backend)
    runs-on: ubuntu-latest
    # The mock backend answers instantly; the time is dominated by environment
    # setup and the client sessions' own timeouts.
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Live mode (not replay) so the real client traffic reaches a server. The
      # mock setup stands up scripts/mock_backend.py (a deterministic in-repo
      # mock provider backend) behind a plain default `ogx go` instead of
      # downloading and generating with a real Ollama model; the tests assert
      # its sentinel in the reply. No HuggingFace assets are needed because
      # the mock serves the embedding model.
      - name: Setup test environment
        uses: ./.github/actions/setup-test-environment
        with:
          python-version: '3.12'
          client-version: 'latest'
          setup: 'mock'
          suite: 'messages'
          inference-mode: 'live'
          enable-hf-cache: 'false'

      # Both clients need the Claude Code CLI at runtime: the CLI test invokes it directly, and the SDK
      # test points the SDK at it (the SDK would otherwise prefer the CLI bundled in its own package).
      # No channel resolution: the installer's own `latest` already gives the newest release, and an
      # exact override (for bisecting a failure) is passed straight through.
      - name: Install Claude Code CLI
        env:
          CLI_VERSION: ${{ inputs.claude-code-version || 'latest' }}
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- "${CLI_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Claude Agent SDK
        env:
          SDK_VERSION: ${{ inputs.agent-sdk-version }}
        run: |
          if [ -n "${SDK_VERSION}" ]; then
            uv pip install "claude-agent-sdk==${SDK_VERSION}"
          else
            uv pip install --upgrade claude-agent-sdk
          fi

      # Nothing above is pinned ahead of time, so this is where we find out what actually got
      # installed: the log, an annotation on the run page, and the job summary. When an exact
      # version was requested to bisect a failure, fail loudly if a different one landed.
      - name: Record client versions
        env:
          CLI_VERSION_OVERRIDE: ${{ inputs.claude-code-version }}
          SDK_VERSION_OVERRIDE: ${{ inputs.agent-sdk-version }}
        run: |
          cli_version=$("$HOME/.local/bin/claude" --version | awk '{print $1}')
          if [ -n "${CLI_VERSION_OVERRIDE}" ] && [ "$cli_version" != "${CLI_VERSION_OVERRIDE}" ]; then
            echo "::error::Failed to install Claude Code CLI ${CLI_VERSION_OVERRIDE}: found ${cli_version}"
            exit 1
          fi
          sdk_version=$(uv run --no-sync python -c "import claude_agent_sdk; print(claude_agent_sdk.__version__)")
          if [ -n "${SDK_VERSION_OVERRIDE}" ] && [ "$sdk_version" != "${SDK_VERSION_OVERRIDE}" ]; then
            echo "::error::Failed to install claude-agent-sdk ${SDK_VERSION_OVERRIDE}: found ${sdk_version}"
            exit 1
          fi
          echo "::notice title=Client versions under test::Claude Code CLI ${cli_version}, Agent SDK ${sdk_version}"
          {
            echo "### Client versions under test"
            echo ""
            echo "| Client | Version |"
            echo "| --- | --- |"
            echo "| Claude Code CLI (used by both smoke tests) | ${cli_version} |"
            echo "| Claude Agent SDK | ${sdk_version} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run Claude Code client smoke tests
        uses: ./.github/actions/run-and-record-tests
        with:
          # The script starts a default `ogx go` on 8321 for the mock setup;
          # the http:// config makes the test client connect to it.
          stack-config: 'http://localhost:8321'
          setup: 'mock'
          suite: 'messages'
          inference-mode: 'live'
          # Selects both test_claude_code_cli_smoke and test_claude_agent_sdk_smoke.
          # Must stay a single shell word: run-and-record-tests passes --pattern
          # unquoted, so a -k expression with spaces would be split into separate
          # arguments.
          pattern: 'test_claude'
