name: Responses API - Codex CLI Smoke Test

run-name: Drive the real Codex CLI against /v1/responses (live, Ollama)

on:
  push:
    branches:
      - main
      - 'release-[0-9]+.[0-9]+.x'
  pull_request:
    branches:
      - main
      - 'release-[0-9]+.[0-9]+.x'
    types: [opened, synchronize, reopened]
    paths:
      - 'src/ogx/cli/connect/**'
      - 'tests/unit/cli/test_connect_codex.py'
      - 'tests/integration/responses/test_codex_cli_smoke.py'
      - 'docs/docs/building_applications/codex_cli_integration.mdx'
      - 'docs/docs/references/ogx_cli_reference/index.md'
      - '.github/workflows/integration-tests-codex-cli.yml'
      - '.github/actions/setup-test-environment/action.yml'
      - '.github/actions/setup-ollama/action.yml'
      - '.github/actions/run-and-record-tests/action.yml'
      - 'scripts/integration-tests.sh'
      - 'pyproject.toml'
      - 'uv.lock'
  merge_group:
    branches:
      - main
      - 'release-[0-9]+.[0-9]+.x'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CODEX_CLI_VERSION: '0.136.0'

jobs:
  codex-cli-smoke:
    name: Codex CLI smoke (ollama, live)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Live mode (not replay) so the Ollama backend is provisioned and the
      # real Codex CLI traffic reaches a real model through /v1/responses.
      - name: Setup test environment
        uses: ./.github/actions/setup-test-environment
        with:
          python-version: '3.12'
          client-version: 'latest'
          setup: 'ollama'
          suite: 'responses'
          inference-mode: 'live'

      - name: Install Codex CLI
        run: |
          npm install -g "@openai/codex@${CODEX_CLI_VERSION}"
          codex --version

      - name: Run Codex CLI smoke test
        uses: ./.github/actions/run-and-record-tests
        with:
          stack-config: 'server:ci-tests'
          setup: 'ollama'
          suite: 'responses'
          inference-mode: 'live'
          pattern: 'test_codex_cli_smoke_uses_generated_ogx_profile'
