# GitHub Dependabot configuration
version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/" # Will use the default workflow location of `.github/workflows`
    schedule:
      interval: "weekly"
      day: "saturday"
    commit-message:
      prefix: chore(github-deps)

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    # Batch all weekly updates into a single PR so the merge queue only has
    # one python-deps PR to chew through instead of one per package.
    groups:
      python-deps:
        patterns:
          - "*"
    # Mirror '<' caps in pyproject.toml so dependabot does not silently widen them.
    # When lifting a cap in pyproject.toml, update or remove the matching ignore rule here.
    ignore:
      - dependency-name: "elasticsearch"
        versions: [">=10.0.0"]
      - dependency-name: "fastapi"
        versions: [">=1.0.0"]
      - dependency-name: "google-genai"
        versions: [">=3.0.0"]
      - dependency-name: "mcp"
        versions: [">=2.0.0"]
      - dependency-name: "milvus-lite"
        versions: [">=3.0.0"]
      - dependency-name: "pypdf"
        versions: [">=6.14.0"]
      - dependency-name: "pytest"
        versions: [">=9.1.0"]
      - dependency-name: "setuptools"
        versions: [">=81"]
    labels:
      - type/dependencies
      - python
    commit-message:
      prefix: chore(python-deps)

  - package-ecosystem: "uv"
    directory: "/src/ogx_api"
    schedule:
      interval: "weekly"
      day: "saturday"
    groups:
      api-deps:
        patterns:
          - "*"
    # Mirror '<' caps in src/ogx_api/pyproject.toml so dependabot does not silently widen them.
    ignore:
      - dependency-name: "fastapi"
        versions: [">=1.0.0"]
    labels:
      - type/dependencies
      - python
    commit-message:
      prefix: chore(api-deps)

  # Covers every package.json in the repo. Batch all weekly updates into a
  # single PR per directory so the merge queue gets at most three js-deps
  # PRs per week instead of one per package.
  - package-ecosystem: npm
    directories:
      - "/docs"
      - "/src/ogx_ui"
      - "/tests/integration/client-typescript"
    schedule:
      interval: "weekly"
      day: "saturday"
    groups:
      js-deps:
        patterns:
          - "*"
    labels:
      - type/dependencies
      - javascript
    commit-message:
      prefix: chore(js-deps)
