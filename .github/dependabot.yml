# GitHub Dependabot configuration
version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/" # Will use the default workflow location of `.github/workflows`
    schedule:
      interval: "weekly"
      day: "saturday"
    commit-message:
      prefix: chore(github-deps)

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    # Batch all weekly updates into a single PR so the merge queue only has
    # one python-deps PR to chew through instead of one per package.
    groups:
      python-deps:
        patterns:
          - "*"
    # Mirror every '<' cap in pyproject.toml so dependabot does not silently widen it.
    # When adding or lifting a cap in pyproject.toml, add or remove the matching
    # ignore rule here (each capped requirement in pyproject.toml points back here).
    #
    #   dependency       cap in pyproject.toml   ignore versions
    #   ---------------- -----------------------  ---------------
    #   elasticsearch    <10.0.0                  >=10.0.0
    #   fastapi          <1.0                     >=1.0.0
    #   google-genai     <3                       >=3.0.0
    #   milvus-lite      <3.0                     >=3.0.0
    #   pytest           <9.1                     >=9.1.0
    #   setuptools       <81                      >=81
    ignore:
      - dependency-name: "elasticsearch"
        versions: [">=10.0.0"]
      - dependency-name: "fastapi"
        versions: [">=1.0.0"]
      - dependency-name: "google-genai"
        versions: [">=3.0.0"]
      - dependency-name: "milvus-lite"
        versions: [">=3.0.0"]
      - dependency-name: "pytest"
        versions: [">=9.1.0"]
      - dependency-name: "setuptools"
        versions: [">=81"]
    labels:
      - type/dependencies
      - python
    commit-message:
      prefix: chore(python-deps)

  - package-ecosystem: "uv"
    directory: "/src/ogx_api"
    schedule:
      interval: "weekly"
      day: "saturday"
    groups:
      api-deps:
        patterns:
          - "*"
    # Mirror every '<' cap in src/ogx_api/pyproject.toml so dependabot does not
    # silently widen it. When adding or lifting a cap there, add or remove the
    # matching ignore rule here (fastapi points back here from that manifest).
    #
    #   dependency   cap in src/ogx_api/pyproject.toml   ignore versions
    #   ------------ ------------------------------------ ---------------
    #   fastapi      <1.0                                  >=1.0.0
    ignore:
      - dependency-name: "fastapi"
        versions: [">=1.0.0"]
    labels:
      - type/dependencies
      - python
    commit-message:
      prefix: chore(api-deps)

  # Covers every package.json in the repo. Batch all weekly updates into a
  # single PR per directory so the merge queue gets at most three js-deps
  # PRs per week instead of one per package.
  - package-ecosystem: npm
    directories:
      - "/docs"
      - "/src/ogx_ui"
      - "/tests/integration/client-typescript"
    schedule:
      interval: "weekly"
      day: "saturday"
    groups:
      js-deps:
        patterns:
          - "*"
    labels:
      - type/dependencies
      - javascript
    commit-message:
      prefix: chore(js-deps)
